<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Background</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital@0;1&display=swap');

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Cormorant Garamond', serif;
  }

  body {
    position: relative;
    background-image:
      linear-gradient(180deg, rgba(60,10,30,0.35) 0%, rgba(90,10,40,0.55) 100%),
      url(picture/1.png);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 2s ease-in;
  }

  .message {
    text-align: center;
    color: #fff5f0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    padding: 40px;
  }

  .message h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 5rem;
    margin: 0 0 10px 0;
    letter-spacing: 1px;
  }

  .message p {
    font-size: 1.4rem;
    font-style: italic;
    letter-spacing: 2px;
    opacity: 0.9;
  }

  .btn {
    display: inline-block;
    margin-top: 30px;
    padding: 16px 40px;
    font-size: 1.2rem;
    color: #fff;
    background: linear-gradient(135deg, #b3324a, #e0577a);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(179, 50, 74, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 30px rgba(224, 87, 122, 0.7);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="message">
    <h1>HAPPY MONTHSARY BABY</h1>
    <a href="2ndmot.html" class="btn">Continue</a>
  </div>

</body>
</html>
