<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Background</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital@0;1&display=swap');

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Cormorant Garamond', serif;
  }

  body {
    position: relative;
    background-image:
      linear-gradient(180deg, rgba(60,10,30,0.35) 0%, rgba(90,10,40,0.55) 100%),
      url(picture/1.png);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 2s ease-in;
  }

  .message {
    text-align: center;
    color: #fff5f0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    padding: 40px;
  }

  .message h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 5rem;
    margin: 0 0 10px 0;
    letter-spacing: 1px;
  }

  .btn-row {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 30px;
  }

  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #fff5f0;
    width: 110px;
    transition: transform 0.25s ease;
  }

  .btn:hover {
    transform: translateY(-8px) scale(1.08);
  }

  .flower {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9db3, #e0577a 60%, #b3324a 100%);
    box-shadow: 0 6px 20px rgba(179, 50, 74, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    border: 3px solid rgba(255, 255, 255, 0.5);
  }

  .btn:hover .flower {
    box-shadow: 0 10px 30px rgba(224, 87, 122, 0.85);
    border-color: #fff;
  }

  .note {
    margin-top: 10px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: 1px;
    opacity: 0.9;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="message">
    <h1>HAPPY MONTHSARY BABY</h1>

    <div class="btn-row">
      <a href="3rd.html" class="btn">
        <div class="flower">🖼️</div>
        <div class="note">Picture</div>
      </a>
      <a href="4th.html" class="btn">
        <div class="flower">🧾</div>
        <div class="note">message</div>
      </a>
      <a href="video.html" class="btn">
        <div class="flower">⌛</div>
        <div class="note">best moment</div>
      </a>
    </div>
  </div>

</body>
</html>
